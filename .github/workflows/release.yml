name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        run: python -m pip install pytest==8.4.2

      - name: Run release gates
        env:
          CI: "true"
          CODEX_SKIP_DISPLAY_TESTS: "1"
        run: |
          CODEX_TIMER_OVERLAY_HOME="$(mktemp -d)" node --test tests/*.test.js
          PYTHONPATH=. python -m pytest -q
          xcrun swiftc -typecheck src/companion_renderer.swift src/timer_panel.swift
          zsh -n scripts/install.sh scripts/uninstall.sh scripts/bootstrap.sh scripts/package-release.sh
          plutil -lint packaging/io.github.codex-pet-companion.plist packaging/companion-renderer-Info.plist

      - name: Build release archive
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
