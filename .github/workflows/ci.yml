name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        run: python -m pip install pytest==8.4.2

      - name: Run Node test suite
        env:
          CODEX_SKIP_DISPLAY_TESTS: "1"
        run: CODEX_TIMER_OVERLAY_HOME="$(mktemp -d)" node --test tests/*.test.js

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Typecheck Swift code
        run: |
          xcrun swiftc -typecheck src/companion_renderer.swift src/timer_panel.swift
          xcrun swiftc -typecheck src/codex_pet_supervisor.swift

      - name: Lint shell scripts
        run: zsh -n scripts/bootstrap.sh scripts/install.sh scripts/uninstall.sh scripts/package-release.sh

      - name: Lint property lists
        run: plutil -lint packaging/io.github.codex-pet-companion.plist packaging/companion-renderer-Info.plist

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD || git diff --check

      - name: Package release and verify checksum
        run: |
          PACKAGE_RELEASE_REF=HEAD ./scripts/package-release.sh v0.1.0
          (cd dist && shasum -a 256 -c SHA256SUMS)
